name = "dota2-cheats"
main = "worker.js"
compatibility_date = "2025-08-01"

# Attach both hosts so Cloudflare creates DNS for www and routes traffic here.
[[routes]]
pattern = "dota2cheats.net"
custom_domain = true

[[routes]]
pattern = "www.dota2cheats.net"
custom_domain = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[build]
command = "npm run build"
